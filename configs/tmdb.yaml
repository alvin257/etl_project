# =========================
# CONFIG: TMDb Movies (API)
# =========================
dataset_name: tmdb_movies
description: "Films populaires issus de The Movie Database (TMDb) via leur API publique."

# ---- Source (API REST) ----
source:
  kind: api
  base_url: "https://api.themoviedb.org/3"
  api_key: "45f53144a31fa5c64fe24e45bd75a746"   # remplace par ta vraie clé API TMDb
  endpoints:
    - "movie/popular"
    - "movie/top_rated"
  params:
    language: "fr-FR"
    page: 1
  storage_options: {}

# ---- Schéma et normalisation ----
schema:
  timestamp_column: "release_date"
  rename:
    id: id
    title: title
    release_date: release_date
    vote_average: rating
    vote_count: votes
    popularity: popularity
  dtypes:
    id: int64
    title: string
    release_date: datetime64[ns]
    rating: float64
    votes: int64
    popularity: float64

# ---- Nettoyage ----
cleaning_rules:
  rating:
    min: 0
    max: 10
    drop_invalid: true
  votes:
    min: 1
    drop_invalid: true
  popularity:
    min: 0
    drop_invalid: true
  drop_duplicates:
    enabled: true
    key_columns: ["id"]

# ---- Features temporelles ----
time_features:
  timezone: "UTC"
  derive:
    year: true
    month: true
    dow: false
    hour: false

# ---- Enrichissements ----
enrichment:
  calendar:
    enabled: true
  rush_hour:
    enabled: false
  taxi_zones:
    enabled: false

# ---- Analytics & exports ----
analytics:
  describe:
    enabled: true
    columns: ["rating", "votes", "popularity"]
  groupbys:
    - { by: ["year"], agg: {"rating": "mean", "votes": "mean"}, out: "agg_by_year.parquet" }

# ---- Sortie ----
output:
  base_dir: "outputs_tmdb"
  partitions: ["year"]
  write_index: false
  manifest: true

# ---- UI Presets ----
ui_presets:
  kpis:
    - { label: "Note moyenne", expr: "mean(rating)" }
    - { label: "Nombre moyen de votes", expr: "mean(votes)" }
    - { label: "Popularité moyenne", expr: "mean(popularity)" }
  charts:
    - { title: "Note moyenne par année", x: "year", y: "mean(rating)", type: "line" }
    - { title: "Popularité moyenne par année", x: "year", y: "mean(popularity)", type: "line" }

# ---- Profiling & logs ----
profiling:
  record: ["extract_s", "transform_s", "load_s"]
  counters: ["rows_read", "rows_final", "n_partitions"]
