# =========================
# CONFIG: IMDb Movies (CSV)
# =========================
dataset_name: imdb_movies
description: IMDb movies + ratings (CSV). Time axis via startYear → decade.

# ---- Source (multi-fichiers CSV) ----
source:
  kind: csv
  paths:
    - "data/imdb/title.basics.csv"      # titres, années, genres
    - "data/imdb/title.ratings.csv"     # notes moyennes, nb de votes
  storage_options: {}
  csv_options:
    sep: ","
    encoding: "utf-8"
    header: true
    infer_datetime: false
  json_options: {}

# ---- Schéma interne (mapping & types)
# On fusionne basics + ratings via tconst
schema:
  join:
    - { left: "data/imdb/title.basics.csv", right: "data/imdb/title.ratings.csv", on: "tconst", how: "left" }
  timestamp_column: release_ts   # fabriquée à partir de startYear (1er janvier de l’année)
  rename:
    tconst: id
    primaryTitle: title
    startYear: year
    runtimeMinutes: runtime_min
    averageRating: rating
    numVotes: votes
    genres: genres_raw
  dtypes:
    id: string
    title: string
    year: int64
    runtime_min: float64
    rating: float64
    votes: int64
    genres_raw: string

# ---- Nettoyage (quality gates)
cleaning_rules:
  year:
    min: 1900
    max: 2025
    drop_invalid: true
  runtime_min:
    min: 1
    max: 400
    drop_invalid: true
  rating:
    min: 0.0
    max: 10.0
    drop_invalid: true
  votes:
    min: 1
    drop_invalid: true
  drop_duplicates:
    enabled: true
    key_columns: ["id"]

# ---- Normalisation & features temporelles
time_features:
  timezone: "UTC"
  derive:
    year: true
    month: false
    dow: false
    hour: false
    decade: true          # spécial: 1990s, 2000s, etc.
  # Construction de release_ts (YYYY-01-01) si pas de vraie date
  synthesize_timestamp:
    from_year: "year"
    month: 1
    day: 1

# ---- Transformations spécifiques (texte/catégories)
categorization:
  genres:
    split_on: ","
    top_k: 15          # garder les 15 genres les plus fréquents, le reste → "Other"

# ---- Enrichissements (exemples simples)
enrichment:
  calendar:
    enabled: true
    holidays_country: "US"
  rush_hour:
    enabled: false
  taxi_zones:
    enabled: false
  weather:
    enabled: false

# ---- Prédictions (optionnelles)
predict:
  enabled: true
  mode: "regression_rating"     # petite démo: prédire rating à partir de year, votes (log), genre principal
  sample_max_rows: 20000
  metrics:
    by: ["decade", "main_genre"]

# ---- Agrégats & exports légers pour l’UI
analytics:
  describe:
    enabled: true
    columns: ["rating", "votes", "runtime_min"]
  groupbys:
    - { by: ["decade"],      agg: {"rating":"mean","votes":"mean"}, out: "agg_by_decade.parquet" }
    - { by: ["main_genre"],  agg: {"rating":"mean","votes":"mean"}, out: "agg_by_genre.parquet" }
    - { by: ["year"],        agg: {"rating":"mean"},                out: "agg_by_year.parquet" }

# ---- Écriture (Load)
output:
  base_dir: "outputs_imdb"
  partitions: ["decade"]       # partition logique pour lecture rapide
  write_index: false
  repartition_target_mb: 128
  manifest: true

# ---- UI (présélections)
ui_presets:
  kpis:
    - { label: "Note moyenne",        expr: "mean(rating)" }
    - { label: "Votes moyens",        expr: "mean(votes)" }
    - { label: "Durée moyenne (min)", expr: "mean(runtime_min)" }
  charts:
    - { title: "Note moyenne par décennie", x: "decade",     y: "mean(rating)", type: "bar" }
    - { title: "Répartition des genres (Top 15)", x: "main_genre", y: "count()", type: "bar" }
    - { title: "Évolution de la note moyenne", x: "year", y: "mean(rating)", type: "line" }

# ---- Profiling & logs
profiling:
  record: ["extract_s","transform_s","predict_s","load_s"]
  counters: ["rows_read","rows_filtered","rows_final","n_partitions"]
